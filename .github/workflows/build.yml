name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reminders-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a GitHub release (main branch only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Reminders.apk
          gh release create "build-${{ github.run_number }}" Reminders.apk \
            --target "${{ github.sha }}" \
            --title "Reminders (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap Reminders.apk to download it, then open the download to install."
