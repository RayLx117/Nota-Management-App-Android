name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Reuse the same signing key across builds. Android only installs an update over an
      # app signed with the same key, and runners otherwise make a new random key each time.
      # The key lives in the Actions cache, never in the repo.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nota-signing.keystore
          key: nota-signing-keystore-v1
      - name: Create signing key if missing
        run: |
          KS="$RUNNER_TEMP/nota-signing.keystore"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nota"
          fi
          echo "NOTA_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nota-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK as a GitHub release (main branch only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Nota.apk
          gh release create "build-${{ github.run_number }}" Nota.apk \
            --target "${{ github.sha }}" \
            --title "Nota (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone, tap Nota.apk to download it, then open the download to install."
